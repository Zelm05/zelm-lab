<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zelm 的信息资源库</title>
<style>
  /* 预加载背景色，避免页面跳转时白屏闪烁 */
  html { background-color: #061814; }
  body { background-color: #061814; }
  [hidden] { display: none !important; }

  /* ===== 外壳布局：iframe 全屏内容区 + 右下角常驻播放器（无顶部导航栏） ===== */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* 覆盖主站 style.css 的 body 190px 侧边占位与背景动画（外壳不需要） */
  body { padding-left: 0 !important; overflow-x: hidden !important; animation: none !important; }

  #contentFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 1;
  }
</style>
<script>
  /* 早期主题应用：读取 localStorage 立即设置，避免浅色用户首屏深色闪烁 */
  (function () {
    var t = 'dark';
    try { t = JSON.parse(localStorage.getItem('zelm_settings') || '{}').theme === 'light' ? 'light' : 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
  /* 跨标签页同步主题 */
  window.addEventListener('storage', function (e) {
    if (e.key !== 'zelm_settings' || !e.newValue) return;
    try {
      var nt = JSON.parse(e.newValue).theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nt);
    } catch (err) { /* 忽略 */ }
  });
</script>
<link rel="stylesheet" href="style.css?v=20260825183700">
</head>
<body>
  <!-- 内容区：home / about / admin 在此加载，切页音乐不中断 -->
  <iframe id="contentFrame" src="home.html" title="Zelm 内容区"></iframe>

  <!-- 常驻音乐播放器（audio 不随页面切换销毁） -->
  <div class="music-player glass" id="musicPlayer">
    <div class="disc" id="disc">
      <div class="disc-cover" id="discCover">♪</div>
      <div class="disc-hole"></div>
    </div>
    <div class="music-main-info">
      <div class="music-main-title" id="musicMainTitle">未播放</div>
      <div class="music-main-artist" id="musicMainArtist">-</div>
      <div class="music-main-progress">
        <span class="music-main-time" id="musicMainCurTime">0:00</span>
        <div class="music-main-bar" id="musicMainBar">
          <div class="music-main-buffered" id="musicMainBuffered"></div>
          <div class="music-main-bar-fill" id="musicMainBarFill"></div>
        </div>
        <span class="music-main-time" id="musicMainDurTime">0:00</span>
      </div>
    </div>
  </div>

  <!-- 音乐列表弹窗 -->
  <div class="music-popup" id="musicPopup" hidden>
    <div class="music-popup-head">
      <span>音乐列表</span>
      <button class="music-popup-close" id="musicPopupClose" aria-label="关闭">✕</button>
    </div>
    <div class="music-popup-body">
      <div class="music-now-playing" id="musicNowPlaying">
        <div class="music-np-disc" id="musicNpDisc"></div>
        <div class="music-np-info">
          <div class="music-np-title" id="musicNpTitle">未播放</div>
          <div class="music-np-artist" id="musicNpArtist">-</div>
        </div>
      </div>
      <div class="music-controls">
        <button class="music-ctrl-btn" id="musicPrevBtn" title="上一首"></button>
        <button class="music-ctrl-btn music-play-btn" id="musicPlayBtn" title="播放/暂停"></button>
        <button class="music-ctrl-btn" id="musicNextBtn" title="下一首"></button>
        <button class="music-ctrl-btn music-mode-btn" id="musicModeBtn" title="播放模式"></button>
      </div>
      <div class="music-progress">
        <span class="music-time" id="musicCurTime">0:00</span>
        <div class="music-progress-track">
          <div class="music-progress-buffered" id="musicBuffered"></div>
          <input type="range" class="music-progress-bar" id="musicProgressBar" min="0" max="100" value="0">
        </div>
        <span class="music-time" id="musicDurTime">0:00</span>
      </div>
      <div class="music-volume">
        <span class="music-volume-icon" id="musicVolumeIcon">🔊</span>
        <input type="range" class="music-volume-bar" id="musicVolumeBar" min="0" max="100" value="70">
        <span class="music-volume-val" id="musicVolumeVal">70%</span>
      </div>
      <div class="music-list" id="musicList"></div>
    </div>
  </div>

  <!-- 顶号通知弹窗 -->
  <div class="modal-overlay" id="sessionKickModal" hidden>
    <div class="modal session-kick-modal" role="dialog">
      <div class="session-kick-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-8h-2v6h2V8z"/></svg></div>
      <h3 class="session-kick-title">账号已在其他设备登录</h3>
      <p class="session-kick-desc">您的账号已在另一台设备登录，您已被下线。</p>
      <button class="session-kick-ok" id="sessionKickOk">我知道了</button>
    </div>
  </div>

  <div class="music-resume-hint" id="musicResumeHint" hidden><span class="music-resume-dot"></span>点击任意处恢复播放</div>
  <audio id="bgAudio" preload="auto"></audio>

  <script src="music-player.js?v=20260825183700"></script>
  <script src="shell.js?v=20260825183700"></script>
</body>
</html>
