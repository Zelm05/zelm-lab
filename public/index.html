<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- 预加载默认首页(home)视图 HTML，提前与外壳脚本并行下载，消除伪 SPA「先跑 shell.js 再 fetch 视图」的串行间隙。
     注意：视图内脚本用 fetch()+new Function 隔离作用域加载，若用 as="script" 预加载会与 fetch 的 CORS 缓存键冲突、
     造成重复下载，故此处仅预加载 home.html 本身。 -->
<link rel="preload" href="home.html" as="fetch">
<meta name="description" content="Zelm 的信息资源库：常用网站、开发工具、学习资料与数据分析作品集，一个在夜里收集星光的个人空间。">
<meta name="theme-color" content="#061814">
<meta name="author" content="Zelm">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zelm 的信息资源库">
<meta property="og:title" content="Zelm 的信息资源库">
<meta property="og:description" content="常用网站、开发工具、学习资料与数据分析作品集，一个在夜里收集星光的个人空间。">
<meta property="og:url" content="https://luminae.dpdns.org/">
<meta property="og:image" content="https://luminae.dpdns.org/assets/photos/photo-01.jpg">
<meta property="og:image:alt" content="Zelm 照片墙封面">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Zelm 的信息资源库">
<meta name="twitter:description" content="常用网站、开发工具、学习资料与数据分析作品集。">
<meta name="twitter:image" content="https://luminae.dpdns.org/assets/photos/photo-01.jpg">
<link rel="canonical" href="https://luminae.dpdns.org/">
<title>Zelm 的信息资源库</title>
<style>
  /* 预加载背景色，避免页面跳转时白屏闪烁 */
  html { background-color: #061814; }
  body { background-color: #061814; }
  [hidden] { display: none !important; }
  /* 站长关闭音乐播放器时隐藏右下角播放器 / 唱片 / 提示 */
  html[data-no-music="1"] #musicPlayer,
  html[data-no-music="1"] #musicPopup,
  html[data-no-music="1"] #musicResumeHint { display: none !important; }

  /* ===== 外壳布局：伪 SPA 内容容器 + 右下角常驻播放器（无顶部导航栏） ===== */
  /* 视图内容注入 #viewRoot，同一时刻只保留当前视图 DOM；切页不重建外壳与 <audio> */
  html, body { margin: 0; padding: 0; height: 100%; }
  html { overflow: hidden; }

  /* 伪 SPA 内容容器：默认铺满视口。
     进入站点后，桌面端让出左侧 190px 导航栏、移动端让出顶部 56px 导航栏，
     使内容整体右移 / 下移，形成“导航 + 内容”两栏，避免重叠。 */
  #viewRoot {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 1;
  }
  /* 桌面端：左侧固定导航栏占位，内容整体右移，分成“导航 + 内容”两部分 */
  html.site-open #viewRoot { left: 190px; }
  /* 移动端：导航变为顶部栏，内容整体下移 */
  @media (max-width: 768px) {
    html.site-open #viewRoot { left: 0; top: 56px; }
  }
</style>
<script>
  /* 早期主题应用：读取 localStorage 立即设置，避免浅色用户首屏深色闪烁 */
  (function () {
    var t = 'dark';
    try { t = JSON.parse(localStorage.getItem('zelm_settings') || '{}').theme === 'light' ? 'light' : 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
  /* 跨标签页同步主题 */
  window.addEventListener('storage', function (e) {
    if (e.key !== 'zelm_settings' || !e.newValue) return;
    try {
      var nt = JSON.parse(e.newValue).theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nt);
    } catch (err) { /* 忽略 */ }
  });
</script>
<script src="site-cfg.js"></script>
<script>
  /* 首屏按站长设置决定是否显示音乐播放器，避免闪烁 */
  (function () {
    try {
      var cfg = window.ZelmSiteCfg ? window.ZelmSiteCfg.read() : { mp: 1 };
      if (cfg.mp !== 1) document.documentElement.setAttribute('data-no-music', '1');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css">
<!-- 管理台视图的自有组件样式（admin.html 仅引 music-player.css，不引 style.css） -->
<link rel="stylesheet" href="music-player.css">
</head>
<body>
  <!-- 内容区：伪 SPA 容器，home / about / admin 由 shell.js fetch 注入；切页音乐不中断 -->
  <div id="viewRoot"></div>

  <!-- 常驻音乐播放器（audio 不随页面切换销毁） -->
  <div class="music-player glass" id="musicPlayer">
    <div class="disc" id="disc">
      <div class="disc-cover" id="discCover">♪</div>
      <div class="disc-hole"></div>
    </div>
    <div class="music-main-info">
      <div class="music-main-title" id="musicMainTitle">未播放</div>
      <div class="music-main-artist" id="musicMainArtist">-</div>
      <div class="music-main-progress">
        <span class="music-main-time" id="musicMainCurTime">0:00</span>
        <div class="music-main-bar" id="musicMainBar">
          <div class="music-main-buffered" id="musicMainBuffered"></div>
          <div class="music-main-bar-fill" id="musicMainBarFill"></div>
        </div>
        <span class="music-main-time" id="musicMainDurTime">0:00</span>
      </div>
    </div>
  </div>

  <!-- 音乐列表弹窗 -->
  <div class="music-popup" id="musicPopup" hidden>
    <div class="music-popup-head">
      <span>音乐列表</span>
      <button class="music-popup-close" id="musicPopupClose" aria-label="关闭">✕</button>
    </div>
    <div class="music-popup-body">
      <div class="music-now-playing" id="musicNowPlaying">
        <div class="music-np-disc" id="musicNpDisc"></div>
        <div class="music-np-info">
          <div class="music-np-title" id="musicNpTitle">未播放</div>
          <div class="music-np-artist" id="musicNpArtist">-</div>
        </div>
      </div>
      <div class="music-controls">
        <button class="music-ctrl-btn" id="musicPrevBtn" title="上一首"></button>
        <button class="music-ctrl-btn music-play-btn" id="musicPlayBtn" title="播放/暂停"></button>
        <button class="music-ctrl-btn" id="musicNextBtn" title="下一首"></button>
        <button class="music-ctrl-btn music-mode-btn" id="musicModeBtn" title="播放模式"></button>
      </div>
      <div class="music-progress">
        <span class="music-time" id="musicCurTime">0:00</span>
        <div class="music-progress-track">
          <div class="music-progress-buffered" id="musicBuffered"></div>
          <input type="range" class="music-progress-bar" id="musicProgressBar" min="0" max="100" value="0" data-i18n-aria="musicProgressAria">
        </div>
        <span class="music-time" id="musicDurTime">0:00</span>
      </div>
      <div class="music-volume">
        <span class="music-volume-icon" id="musicVolumeIcon">🔊</span>
        <input type="range" class="music-volume-bar" id="musicVolumeBar" min="0" max="100" value="70" data-i18n-aria="musicVolumeAria">
        <span class="music-volume-val" id="musicVolumeVal">70%</span>
      </div>
      <div class="music-list" id="musicList"></div>
    </div>
  </div>

  <!-- 顶号通知弹窗 -->
  <div class="modal-overlay" id="sessionKickModal" hidden>
    <div class="modal session-kick-modal" role="dialog">
      <div class="session-kick-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-8h-2v6h2V8z"/></svg></div>
      <h3 class="session-kick-title">账号已在其他设备登录</h3>
      <p class="session-kick-desc">您的账号已在另一台设备登录，您已被下线。</p>
      <button class="session-kick-ok" id="sessionKickOk">我知道了</button>
    </div>
  </div>

  <div class="music-resume-hint" id="musicResumeHint" hidden><span class="music-resume-dot"></span>点击任意处恢复播放</div>
  <audio id="bgAudio" preload="auto"></audio>

  <script src="music-player.js"></script>
  <script src="shell.js"></script>
</body>
</html>
