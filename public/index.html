<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zelm 的信息资源库</title>
<style>
  /* 预加载背景色，避免页面跳转时白屏闪烁 */
  html { background-color: #061814; }
  body { background-color: #061814; }
  [hidden] { display: none !important; }

  /* ===== 外壳布局：iframe 内容区 + 顶部页面切换栏 + 右下角常驻播放器 ===== */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  /* 覆盖主站 style.css 的 body 190px 侧边占位与背景动画（外壳不需要） */
  body { padding-left: 0 !important; overflow-x: hidden !important; animation: none !important; }

  #contentFrame {
    position: fixed;
    inset: 0;
    top: 48px;
    width: 100%;
    height: calc(100% - 48px);
    border: 0;
    z-index: 1;
  }

  /* 顶部页面切换栏（悬浮于 iframe 之上） */
  .shell-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    box-sizing: border-box;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    background: rgba(6, 24, 20, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid rgba(79, 240, 208, 0.18);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  .shell-brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    color: #4ff0d0;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 8px;
    user-select: none;
    margin-right: 6px;
    white-space: nowrap;
  }
  .shell-brand:hover { background: rgba(79, 240, 208, 0.1); }
  .shell-page-btn {
    border: 1px solid rgba(79, 240, 208, 0.22);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(232, 251, 247, 0.85);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .shell-page-btn:hover { border-color: #4ff0d0; color: #4ff0d0; background: rgba(79, 240, 208, 0.08); }
  .shell-page-btn.active { background: linear-gradient(135deg, rgba(79,240,208,.9), rgba(91,139,255,.9)); border-color: transparent; color: #022; font-weight: 600; }
  .shell-spacer { flex: 1; }
  .shell-note {
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.35);
    margin-right: 8px;
    white-space: nowrap;
    display: none;
  }
  @media (min-width: 640px) { .shell-note { display: inline; } }

  /* 浅色主题适配 */
  html[data-theme="light"] .shell-bar {
    background: rgba(214, 236, 222, 0.85);
    border-bottom-color: rgba(28, 75, 50, 0.18);
  }
  html[data-theme="light"] .shell-brand { color: #1f6b4a; }
  html[data-theme="light"] .shell-page-btn {
    border-color: rgba(28, 75, 50, 0.2);
    color: rgba(26, 46, 34, 0.8);
  }
  html[data-theme="light"] .shell-page-btn:hover { border-color: #2d7a5a; color: #1f6b4a; }
  html[data-theme="light"] .shell-note { color: rgba(26, 46, 34, 0.4); }
</style>
<script>
  /* 早期主题应用：读取 localStorage 立即设置，避免浅色用户首屏深色闪烁 */
  (function () {
    var t = 'dark';
    try { t = JSON.parse(localStorage.getItem('zelm_settings') || '{}').theme === 'light' ? 'light' : 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
  /* 跨标签页同步主题 */
  window.addEventListener('storage', function (e) {
    if (e.key !== 'zelm_settings' || !e.newValue) return;
    try {
      var nt = JSON.parse(e.newValue).theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nt);
    } catch (err) { /* 忽略 */ }
  });
</script>
<link rel="stylesheet" href="style.css?v=20260826">
</head>
<body>
  <!-- 内容区：home / about / admin 在此加载，切页音乐不中断 -->
  <iframe id="contentFrame" src="home.html" title="Zelm 内容区"></iframe>

  <!-- 顶部页面切换栏 -->
  <div class="shell-bar" id="shellBar">
    <span class="shell-brand" id="shellBrand" title="回到主站">◉ Zelm</span>
    <button class="shell-page-btn active" data-page="home" type="button">主站</button>
    <button class="shell-page-btn" data-page="about" type="button">关于我</button>
    <button class="shell-page-btn" data-page="admin" type="button">管理后台</button>
    <span class="shell-spacer"></span>
    <span class="shell-note">切换页面时音乐不间断</span>
  </div>

  <!-- 常驻音乐播放器（audio 不随页面切换销毁） -->
  <div class="music-player glass" id="musicPlayer">
    <div class="disc" id="disc">
      <div class="disc-cover" id="discCover">♪</div>
      <div class="disc-hole"></div>
    </div>
    <div class="music-main-info">
      <div class="music-main-title" id="musicMainTitle">未播放</div>
      <div class="music-main-artist" id="musicMainArtist">-</div>
      <div class="music-main-progress">
        <span class="music-main-time" id="musicMainCurTime">0:00</span>
        <div class="music-main-bar" id="musicMainBar"><div class="music-main-bar-fill" id="musicMainBarFill"></div></div>
        <span class="music-main-time" id="musicMainDurTime">0:00</span>
      </div>
    </div>
  </div>

  <!-- 音乐列表弹窗 -->
  <div class="music-popup" id="musicPopup" hidden>
    <div class="music-popup-head">
      <span>音乐列表</span>
      <button class="music-popup-close" id="musicPopupClose" aria-label="关闭">✕</button>
    </div>
    <div class="music-popup-body">
      <div class="music-now-playing" id="musicNowPlaying">
        <div class="music-np-disc" id="musicNpDisc"></div>
        <div class="music-np-info">
          <div class="music-np-title" id="musicNpTitle">未播放</div>
          <div class="music-np-artist" id="musicNpArtist">-</div>
        </div>
      </div>
      <div class="music-controls">
        <button class="music-ctrl-btn" id="musicPrevBtn" title="上一首"></button>
        <button class="music-ctrl-btn music-play-btn" id="musicPlayBtn" title="播放/暂停"></button>
        <button class="music-ctrl-btn" id="musicNextBtn" title="下一首"></button>
        <button class="music-ctrl-btn music-mode-btn" id="musicModeBtn" title="播放模式"></button>
      </div>
      <div class="music-progress">
        <span class="music-time" id="musicCurTime">0:00</span>
        <input type="range" class="music-progress-bar" id="musicProgressBar" min="0" max="100" value="0">
        <span class="music-time" id="musicDurTime">0:00</span>
      </div>
      <div class="music-volume">
        <span class="music-volume-icon" id="musicVolumeIcon">🔊</span>
        <input type="range" class="music-volume-bar" id="musicVolumeBar" min="0" max="100" value="70">
        <span class="music-volume-val" id="musicVolumeVal">70%</span>
      </div>
      <div class="music-list" id="musicList"></div>
    </div>
  </div>

  <!-- 顶号通知弹窗 -->
  <div class="modal-overlay" id="sessionKickModal" hidden>
    <div class="modal session-kick-modal" role="dialog">
      <div class="session-kick-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-8h-2v6h2V8z"/></svg></div>
      <h3 class="session-kick-title">账号已在其他设备登录</h3>
      <p class="session-kick-desc">您的账号已在另一台设备登录，您已被下线。</p>
      <button class="session-kick-ok" id="sessionKickOk">我知道了</button>
    </div>
  </div>

  <div class="music-resume-hint" id="musicResumeHint" hidden><span class="music-resume-dot"></span>点击任意处恢复播放</div>
  <audio id="bgAudio" preload="auto"></audio>

  <script src="music-player.js"></script>
  <script src="shell.js"></script>
</body>
</html>
