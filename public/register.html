<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册</title>
<style>
  :root { --accent:#0ea5e9; --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --err:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { width:340px; background:var(--card); padding:32px 28px; border-radius:14px;
          box-shadow:0 10px 40px rgba(0,0,0,.35); }
  h1 { margin:0 0 18px; font-size:22px; text-align:center; }
  label { display:block; font-size:13px; margin:14px 0 6px; opacity:.85; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid #334155;
          background:#0f172a; color:var(--text); font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; margin-top:22px; padding:12px; border:none; border-radius:9px;
           background:var(--accent); color:#04121f; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:13px; min-height:18px; text-align:center; }
  .msg.err { color:var(--err); }
  .msg.ok { color:#4ade80; }
  .link { margin-top:16px; text-align:center; font-size:13px; }
  .link a { color:var(--accent); text-decoration:none; }
  .hint { font-size:12px; opacity:.6; margin-top:4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>注册</h1>
    <form id="registerForm">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <div class="hint">3-32 位，仅字母/数字/下划线</div>

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <div class="hint">至少 8 位</div>

      <label for="confirm">确认密码</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

      <button type="submit" id="submitBtn">注册</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="link">已有账号？<a href="/login.html">去登录</a></div>
  </div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  msg.textContent = ''; msg.className = 'msg';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password !== confirm) {
    msg.textContent = '两次输入的密码不一致';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = '注册成功，正在前往登录…';
      msg.className = 'msg ok';
      setTimeout(() => (window.location.href = '/login.html'), 800);
    } else {
      msg.textContent = data.error || '注册失败';
      msg.className = 'msg err';
      btn.disabled = false;
    }
  } catch (err) {
    msg.textContent = '网络错误，请重试';
    msg.className = 'msg err';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
