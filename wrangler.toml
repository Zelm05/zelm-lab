# ===================================================================
# wrangler.toml — zelm 重构版（Vue3 + Hono + D1，单 Worker 部署）
#
# 部署前准备：
#   1) 前端产物：npm run build（输出到 ./dist）
#   2) wrangler secret put JWT_SECRET   输入一段随机串
#   3) 数据库迁移：wrangler d1 execute auth-db --remote --file=./migrations/schema.sql
#      （后续每个 migration-*.sql 按需执行）
# ===================================================================

name = "zelm-vue"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 前端静态产物（Vite 构建输出）由 Worker 托管。
# run_worker_first = true：所有请求先过 Worker，这样安全头下发、
# 曲库开关（/assets/music/ 404）、站点配置 Cookie 才能生效。
# 后续优化项：改为 run_worker_first = ["/api/*","/assets/music/*"] + dist/_headers
# 声明式缓存，让静态资源直接走 Workers Assets CDN。
assets = { directory = "./dist", binding = "ASSETS", run_worker_first = true }

# ====== D1 数据库绑定 ======
# 说明：这里沿用原站同一个数据库（auth-db），方便直接复用已有账号做联调。
# 若想完全隔离测试环境，请新建一个库并把 database_id 换掉。
[[d1_databases]]
binding = "DB"
database_name = "auth-db"
database_id = "24d5ccd7-dec4-4c29-82af-bbd633e83643"

# ⚠️ JWT 密钥不要写在这里（会进版本库），用：wrangler secret put JWT_SECRET

# ====== 自定义域名 ======
# ⚠️ 先不要绑定 luminae.dpdns.org —— 那会把线上 zelm 的流量抢过来。
# 等重构版验证完毕、准备好切换时再放开下面两行。
# [[routes]]
# pattern = "luminae.dpdns.org"
# custom_domain = true
