# ===================================================================
# wrangler.toml — zelm 重构版（Vue3 + Hono + D1，单 Worker 部署）
#
# ⚠️ name 必须是线上既有的 worker 名 `zelm`（它与 GitHub 仓库绑定、
#    并持有自定义域名 luminae.dpdns.org）。换成别的名字只会另建一个新
#    worker，域名不会跟过去。
#
# 部署前准备：
#   1) 前端产物：npm run build（输出到 ./dist）
#   2) wrangler secret put JWT_SECRET   输入一段随机串（secret 按 worker 隔离，
#      不会从旧 worker 继承）
#   3) 数据库迁移：wrangler d1 execute auth-db --remote --file=./migrations/schema.sql
#      再按文件名顺序补跑全部 migration-*.sql（全新库只跑 schema.sql 会缺列）
# ===================================================================

name = "zelm"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 前端静态产物（Vite 构建输出）由 Worker 托管。
# run_worker_first = true：所有请求先过 Worker，这样安全响应头（CSP 等）
# 与站点配置 Cookie 才能生效。
# 后续优化项：改为 run_worker_first = ["/api/*"] + dist/_headers 声明式缓存，
# 让静态资源直接走 Workers Assets CDN。
# run_worker_first = ["/api/*", 旧路径]：
#   · /api/* 必须过 Worker（鉴权/限流/安全头）
#   · 旧路径（/about、/home.html 等）由 Worker 302 到 hash 路由，否则会 404
#   · 其余静态资源**直接走 Cloudflare 边缘缓存**（安全头/缓存策略见 public/_headers）
assets = { directory = "./dist", binding = "ASSETS", run_worker_first = [
  "/api/*",
  "/index.html", "/home.html", "/home", "/about.html", "/about",
  "/admin.html", "/admin", "/gate.html", "/gate",
  "/privacy.html", "/privacy", "/privacy/t",
] }

# ====== D1 数据库绑定 ======
# 说明：这里沿用原站同一个数据库（auth-db），方便直接复用已有账号做联调。
# 若想完全隔离测试环境，请新建一个库并把 database_id 换掉。
[[d1_databases]]
binding = "DB"
database_name = "auth-db"
database_id = "24d5ccd7-dec4-4c29-82af-bbd633e83643"

# ====== Workers AI 绑定（后台「机器翻译」用）======
# 绑定名必须是 AI（worker/translate.js 里读 env.AI）。
# 好处：**不需要任何第三方密钥**，翻译由 Cloudflare 自己跑；
#   免费额度按 Neurons 计（每天有免费配额），超出后按模型单价计费。
#
# ⚠️ remote = true 是必须的：AI 绑定**没有本地模拟**（wrangler dev 会显示
#    "Mode: not supported"），不加这行时本地调用 env.AI.run 拿不到实例；
#    加上之后本地开发会**真的调用云端模型**（可能产生费用，与线上一致）。
#    官方提示原文：AI bindings always access remote resources.
#
# 不用机器翻译的话可以整段注释掉 —— 那时后台点「机器翻译」会提示未配置。
[ai]
binding = "AI"
remote = true

# ⚠️ JWT 密钥不要写在这里（会进版本库），用：wrangler secret put JWT_SECRET

# ====== 自定义域名 ======
# luminae.dpdns.org 已经绑在本 worker（zelm）上。这里显式声明一次，
# 保证每次部署后域名绑定保持不变、不会因配置缺省而被解绑。
[[routes]]
pattern = "luminae.dpdns.org"
custom_domain = true

# ====== 站点变量（公开信息，非密钥）======
[vars]
# Supabase 项目 URL（公开）。改项目只改这里，不用动代码。
SUPABASE_URL = "https://wrguksjsbdvoqfedsdow.supabase.co"
